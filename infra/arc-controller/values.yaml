# GitHub Actions Runner Scale Set Controller Helm Chart Values
# Deploy ARC controller to arc-systems namespace
# Based on: https://docs.github.com/en/actions/tutorials/use-actions-runner-controller/quickstart

# Override the default namespace
namespaceOverride: arc-systems

# Controller replica count
# Temporarily 0: the org's ARC GitHub App is returning 403 "Resource not
# accessible by integration" on runner-registration-token requests
# (2026-09-08, org-wide, cause still open). Every scale set's listener pod
# was crash-looping every ~15-30s waiting on this, and the sustained churn
# wedged murderbot's kubelet (PLEG unhealthy), which evicted every pod on
# the node. Scaling the controller to 0 stops it from respawning listener
# pods. Runner fixup/unification is deferred to a separate session -- set
# this back to 1 only once that work resumes, not as a quick revert.
replicaCount: 0

# Image configuration
image:
  repository: ghcr.io/actions/gha-runner-scale-set-controller
  pullPolicy: IfNotPresent
  tag: ""  # Uses chart appVersion by default

# Service account configuration
serviceAccount:
  create: true
  name: ""  # Auto-generated if not set

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

# Pod security context
podSecurityContext:
  fsGroup: 1000

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Logging
flags:
  logLevel: "info"

# Watch all namespaces (set to namespace name to watch single namespace)
# watchSingleNamespace: ""
