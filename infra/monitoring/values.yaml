# kube-prometheus-stack Helm Values
# Monitoring stack for K3s on Raspberry Pi
#
# Prometheus runs in full mode with local rule evaluation and forwards samples to mac-mini.
# mac-mini (Komodo) holds the real/long-term Prometheus. This instance is intentionally a
# thin, ephemeral edge buffer in front of remote_write — it must never accumulate a WAL that
# outlives a pod restart (see incident: a PVC-backed WAL grew to 4700+ segments and crash-
# looped forever because the startup probe kept killing the pod mid-replay, so it could never
# finish long enough to compact and shrink). No PVC, no local persistence across restarts.

# --- AlertManager: watchdog alerts, routed to Pushover (see infra/monitoring/alerting/) ---
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 5Gi

# --- Prometheus ---
prometheus:
  prometheusSpec:
    # Use EndpointSlice for target discovery (Endpoints v1 deprecated in k8s 1.33+).
    serviceDiscoveryRole: EndpointSlice
    externalLabels:
      cluster: k3s-dean
      role: edge-prometheus
    walCompression: true
    retention: 30m
    retentionSize: 1500MB
    # No PVC: storage is emptyDir, wiped on every pod restart/reschedule. This is deliberate —
    # data only needs to survive long enough to be remote-written to mac-mini, and an ephemeral
    # volume means a restart always starts from an empty WAL (near-instant replay) instead of
    # ever being able to accumulate an unbounded WAL that a startup probe can't get through.
    # sizeLimit backstops retentionSize so a scrape spike can't fill the node's disk.
    storageSpec:
      emptyDir:
        sizeLimit: 2Gi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - murderbot
                    - archlinux
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - murderbot
    # Sized for an edge buffer holding <=30m of data, not for compacting a large TSDB.
    # Headroom note: emptyDir persists across container restarts within the same pod (only
    # a pod reschedule gets a fresh volume), so an OOMKilled restart replays whatever WAL was
    # already on disk instead of starting empty. The 1Gi limit wasn't enough to replay a WAL
    # that had piled up across a restart loop, which fed the loop instead of breaking it
    # (incident: 2026-08-02, 55 restarts over 10h). This limit is intentionally well above
    # steady-state usage to guarantee replay always succeeds and the loop can't self-sustain.
    #
    # 2026-09-07 recurrence: head series had grown to ~503K, which pushed the container past
    # this 2Gi limit and into the same OOM/replay crash loop for ~12h before the pod was
    # finally evicted and recreated clean. Root cause was NOT scope creep — a full audit of
    # every Grafana dashboard (2026-09-08) confirmed all ~28 scrape jobs here are genuinely
    # consumed by a purpose-built dashboard or alert (mac-mini has no other vantage point with
    # ServiceMonitor/ClusterIP access to argocd/longhorn/external-dns/etc — this Prometheus is
    # the only source for any of it). The actual fix is the metricRelabelings below, which drop
    # ~175K series of confirmed-zero-usage metrics without touching anything dashboarded. This
    # limit bump is headroom on top of that cut, not a substitute for it. Request was also
    # 256Mi against ~1.4-2GB actual usage — raised so the pod's QoS reflects real usage instead
    # of being first-evicted under node memory pressure.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 3Gi
    remoteWrite:
      - url: "http://10.100.20.18:9090/api/v1/write"
        queueConfig:
          capacity: 10000
          maxShards: 30
          minShards: 1
          maxSamplesPerSend: 5000
          batchSendDeadline: 5s
          minBackoff: 100ms
          maxBackoff: 10s
        # Drop node-exporter series for murderbot/archlinux before they leave this cluster.
        # mac-mini's own Prometheus already scrapes both directly (jobs murderbot-node /
        # archlinux-node, instance relabeled to the plain node name). This DaemonSet's
        # node-exporter pod on those same two nodes remote-writes the identical host metrics
        # under job="node-exporter", instance="<ip>:9100" instead — a second, differently-
        # labeled copy of the same series landing in the same TSDB. Every alert rule over
        # those metrics (e.g. RaidArrayDegraded on murderbot's md0) then evaluates both
        # copies independently and fires twice for one real condition. rpi5-0/rpi5-1/rpi4-0
        # have no other metrics source, so their node-exporter series must still pass through.
        writeRelabelConfigs:
          - source_labels: [job, node]
            regex: "node-exporter;(murderbot|archlinux)"
            action: drop
    # Scrape external targets (outside k8s)
    additionalScrapeConfigs:
      # Cross-stack heartbeat — mac-mini Prometheus health probe
      - job_name: mac-mini-prometheus-heartbeat
        scheme: http
        metrics_path: /metrics
        scrape_interval: 15s
        static_configs:
          - targets: ["10.100.20.18:9090"]
            labels:
              cluster: mac-mini-m4
    # Only load rules from our heartbeat PrometheusRule (no kube-prometheus default rules)
    ruleSelector:
      matchLabels:
        app.kubernetes.io/component: heartbeat
    # Nil selector = Prometheus Operator matches every ServiceMonitor/PodMonitor in the
    # cluster, not just this release's own. That's deliberate, not a leak: this is the only
    # Prometheus with ClusterIP/ServiceMonitor access to in-cluster apps (argocd, longhorn,
    # external-dns, external-secrets, cert-manager, traefik, coredns, metallb, reloader,
    # arc-controller, unifi-poller, praetor, ecdysis, speedtest-exporter...) — mac-mini can
    # only blackbox-probe a handful of public ingress URLs, it has no other way to reach any
    # of this. Confirmed via a full audit of every dashboard JSON (2026-09-08): all ~28 jobs
    # here are consumed by a real dashboard or alert. Scoping this down to release-only
    # ServiceMonitors (tried in an earlier draft of this fix) would have gone straight to "No
    # data" on ~15 dashboards in the Infra/ folder. Leave nil.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# kubeApiServer/kubeEtcd stay enabled — infra-kubernetes-cluster.json and infra-etcd.json
# genuinely dashboard apiserver_request_total/_duration_seconds_bucket and etcd's leader/WAL/
# backend-commit/db-size/peer-latency metrics respectively (confirmed 2026-09-08). The actual
# ~503K-head-series problem was a handful of specific metrics with zero dashboard or alert
# usage anywhere in the repo (confirmed via full-text search), not these components as a
# whole — dropped at scrape time instead of disabling the components that also carry the
# metrics that ARE used.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # apiserver_request_duration_seconds_bucket (55,148 series) IS used — but only ever
      # grouped by verb/code/le (infra-kubernetes-cluster.json's p99-by-verb panel). The raw
      # metric also carries resource/subresource/scope/component/group/version, which is what
      # actually multiplies it out; no panel or alert references any of those six.
      - action: labeldrop
        regex: "resource|subresource|scope|component|group|version"
      # These five apiserver histograms (~90K series combined) have zero dashboard or alert
      # usage anywhere in komodo-dean-gitops (confirmed via repo-wide search 2026-09-08).
      - source_labels: [__name__]
        regex: "apiserver_request_sli_duration_seconds_(bucket|count|sum)|apiserver_request_body_size_bytes_(bucket|count|sum)|apiserver_response_sizes_(bucket|count|sum)|apiserver_watch_cache_read_wait_seconds_(bucket|count|sum)|apiserver_watch_events_sizes_(bucket|count|sum)"
        action: drop
kubeEtcd:
  serviceMonitor:
    metricRelabelings:
      # etcd_request_duration_seconds_bucket is the single largest metric on this Prometheus
      # (55,420 series) and has zero dashboard or alert usage anywhere in the repo (confirmed
      # via repo-wide search 2026-09-08) — infra-etcd.json's latency panels use
      # etcd_disk_wal_fsync_duration_seconds_bucket / etcd_disk_backend_commit_duration_seconds_bucket
      # instead (45 series each, no cardinality concern). grpc_server_handled_total is etcd's
      # own gRPC-server instrumentation, also unused (ArgoCD emits a separate small share of
      # this same metric name — left alone here, out of scope for this component).
      - source_labels: [__name__]
        regex: "etcd_request_duration_seconds_(bucket|count|sum)|grpc_server_handled_total"
        action: drop

# --- Grafana ---
grafana:
  # Disabled — we forward all metrics to mac-mini's Grafana for full dashboards.
  enabled: false

defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    configReloaders: false
    general: false
    k8sContainerCpuUsageSecondsTotal: false
    k8sContainerMemoryCache: false
    k8sContainerMemoryRss: false
    k8sContainerMemorySwap: false
    k8sContainerResource: false
    k8sContainerMemoryWorkingSetBytes: false
    k8sPodOwner: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubelet: false
    kubeProxy: false
    kubePrometheusGeneral: false
    kubePrometheusNodeRecording: false
    kubernetesApps: false
    kubernetesResources: false
    kubernetesStorage: false
    kubernetesSystem: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: false
    network: false
    node: false
    nodeExporterAlerting: false
    nodeExporterRecording: false
    prometheus: false
    prometheusOperator: false
