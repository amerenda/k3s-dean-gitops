# kube-prometheus-stack Helm Values
# Monitoring stack for K3s on Raspberry Pi
#
# Prometheus runs in full mode with local rule evaluation and forwards samples to mac-mini.
# mac-mini (Komodo) holds the real/long-term Prometheus. This instance is intentionally a
# thin, ephemeral edge buffer in front of remote_write — it must never accumulate a WAL that
# outlives a pod restart (see incident: a PVC-backed WAL grew to 4700+ segments and crash-
# looped forever because the startup probe kept killing the pod mid-replay, so it could never
# finish long enough to compact and shrink). No PVC, no local persistence across restarts.

# --- AlertManager: watchdog alerts, routed to Pushover (see infra/monitoring/alerting/) ---
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 5Gi

# --- Prometheus ---
prometheus:
  prometheusSpec:
    # Use EndpointSlice for target discovery (Endpoints v1 deprecated in k8s 1.33+).
    serviceDiscoveryRole: EndpointSlice
    externalLabels:
      cluster: k3s-dean
      role: edge-prometheus
    walCompression: true
    retention: 30m
    retentionSize: 1500MB
    # No PVC: storage is emptyDir, wiped on every pod restart/reschedule. This is deliberate —
    # data only needs to survive long enough to be remote-written to mac-mini, and an ephemeral
    # volume means a restart always starts from an empty WAL (near-instant replay) instead of
    # ever being able to accumulate an unbounded WAL that a startup probe can't get through.
    # sizeLimit backstops retentionSize so a scrape spike can't fill the node's disk.
    storageSpec:
      emptyDir:
        sizeLimit: 2Gi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - murderbot
                    - archlinux
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - murderbot
    # Sized for an edge buffer holding <=30m of data, not for compacting a large TSDB.
    # Headroom note: emptyDir persists across container restarts within the same pod (only
    # a pod reschedule gets a fresh volume), so an OOMKilled restart replays whatever WAL was
    # already on disk instead of starting empty. The 1Gi limit wasn't enough to replay a WAL
    # that had piled up across a restart loop, which fed the loop instead of breaking it
    # (incident: 2026-08-02, 55 restarts over 10h). This limit is intentionally well above
    # steady-state usage to guarantee replay always succeeds and the loop can't self-sustain.
    #
    # 2026-09-07 recurrence: head series had grown to ~503K (mostly kubeApiServer/kubeEtcd
    # histogram buckets and third-party apps' own ServiceMonitors getting swept in by the nil
    # selector below — see serviceMonitorSelectorNilUsesHelmValues), which pushed the
    # container past this 2Gi limit and into the same OOM/replay crash loop for ~12h before
    # the pod was finally evicted and recreated clean. The selector/component fixes below
    # should cut steady-state series by an order of magnitude; this limit bump is headroom on
    # top of that fix, not a substitute for it. Request was also 256Mi against ~1.4-2GB actual
    # usage — raised so the pod's QoS reflects real usage instead of being first-evicted under
    # node memory pressure.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 3Gi
    remoteWrite:
      - url: "http://10.100.20.18:9090/api/v1/write"
        queueConfig:
          capacity: 10000
          maxShards: 30
          minShards: 1
          maxSamplesPerSend: 5000
          batchSendDeadline: 5s
          minBackoff: 100ms
          maxBackoff: 10s
    # Scrape external targets (outside k8s)
    additionalScrapeConfigs:
      # Cross-stack heartbeat — mac-mini Prometheus health probe
      - job_name: mac-mini-prometheus-heartbeat
        scheme: http
        metrics_path: /metrics
        scrape_interval: 15s
        static_configs:
          - targets: ["10.100.20.18:9090"]
            labels:
              cluster: mac-mini-m4
    # Only load rules from our heartbeat PrometheusRule (no kube-prometheus default rules)
    ruleSelector:
      matchLabels:
        app.kubernetes.io/component: heartbeat
    # This Prometheus exists for exactly two things: scrape k3s node/pod health (kubelet,
    # node-exporter, kube-state-metrics — all part of this same Helm release) and ship it to
    # mac-mini via remote_write, plus the heartbeat rule above. `false` here left both
    # selectors nil, which Prometheus Operator reads as "match every ServiceMonitor/PodMonitor
    # in the cluster" — by 2026-09-07 that had silently adopted ~15 unrelated jobs (every
    # argocd-*, longhorn, external-dns, external-secrets, cert-manager, traefik, praetor,
    # ecdysis, unifi-poller, speedtest-exporter... ServiceMonitor in the cluster), none of
    # which belongs on a thin edge buffer. `true` (the chart default) scopes selection back
    # to ServiceMonitors/PodMonitors carrying this release's own label, which kubelet/
    # node-exporter/kube-state-metrics already do since they're deployed by this same release.
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true

# kube-apiserver/etcd/CoreDNS are k3s control-plane internals, not node/pod health — and their
# histogram-bucket metrics (etcd_request_duration_seconds_bucket alone: 55K+ series) were most
# of the ~503K head series behind the 2026-09-07 OOM. Out of scope for this edge buffer; disabled.
kubeApiServer:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false

# --- Grafana ---
grafana:
  # Disabled — we forward all metrics to mac-mini's Grafana for full dashboards.
  enabled: false

defaultRules:
  create: true
  rules:
    alertmanager: false
    etcd: false
    configReloaders: false
    general: false
    k8sContainerCpuUsageSecondsTotal: false
    k8sContainerMemoryCache: false
    k8sContainerMemoryRss: false
    k8sContainerMemorySwap: false
    k8sContainerResource: false
    k8sContainerMemoryWorkingSetBytes: false
    k8sPodOwner: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubelet: false
    kubeProxy: false
    kubePrometheusGeneral: false
    kubePrometheusNodeRecording: false
    kubernetesApps: false
    kubernetesResources: false
    kubernetesStorage: false
    kubernetesSystem: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: false
    network: false
    node: false
    nodeExporterAlerting: false
    nodeExporterRecording: false
    prometheus: false
    prometheusOperator: false
