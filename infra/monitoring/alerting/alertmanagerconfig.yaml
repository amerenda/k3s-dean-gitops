# Alertmanager (alertmanagerConfigSelector/NamespaceSelector are both {} on the
# infra-monitoring Alertmanager CR) auto-discovers AlertmanagerConfig objects in any
# namespace, so this needs no label to be picked up. It becomes a sub-route scoped to
# alerts originating in the monitoring namespace (where all our PrometheusRules live) —
# everything else still falls through to the chart's default "null" receiver.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: pushover-alerts
  namespace: monitoring
spec:
  route:
    receiver: pushover
    groupBy: ["alertname"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 6h
  receivers:
    - name: pushover
      pushoverConfigs:
        - userKey:
            name: pushover-credentials
            key: user-key
          token:
            name: pushover-credentials
            key: token
          # message ranges over .Alerts, NOT .CommonAnnotations -- CommonAnnotations
          # only shows text that's byte-identical across every alert in the group, so
          # it silently blanks out whenever 2+ instances of the same alertname fire
          # with different label values. Found 2026-08-28 on the mini's Alertmanager
          # (komodo-dean-gitops#236-ish) via a DiskSpaceLow firing on two mountpoints
          # at once producing a Pushover push with no details. Mirrored here even
          # though every current rule on this Alertmanager (just MacMiniPrometheusDown)
          # is single-instance — keeps this safe for whatever gets added next.
          title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }}){{ if gt (len .Alerts) 1 }} x{{ len .Alerts }}{{ end }}"
          message: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
          # Operator defaults this to pushover.default.url, which templates to Alertmanager's
          # externalUrl (http://infra-monitoring-kube-prom-alertmanager.monitoring:9093) — an
          # in-cluster-only address that's useless from a phone. Point it at the public ingress.
          url: "https://k3s-alertmanager.amer.dev"
          priority: "0"
          sendResolved: true
