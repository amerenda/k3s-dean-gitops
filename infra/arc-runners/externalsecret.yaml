apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: controller-manager
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "0"  # Install before runner scale set
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: controller-manager
    creationPolicy: Owner
  data:
  - secretKey: github_app_id
    remoteRef:
      key: github-app-arc-id
      property: github_app_id
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: github_app_installation_id
    remoteRef:
      key: github-app-arc-installation-id
      property: github_app_installation_id
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: github_app_private_key
    remoteRef:
      key: github-app-arc-private-key
      property: github_app_private_key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runner-ci-credentials
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: runner-ci-credentials
    creationPolicy: Owner
  data:
  - secretKey: DOCKERHUB_TOKEN
    remoteRef:
      key: docker-hub-k3s-runner-api-key
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: GITOPS_PAT
    remoteRef:
      key: github-pat-k3s-dean-gitops
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: TS_API_KEY
    remoteRef:
      key: k3s-dean-tailscale-api-key
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: CODER_APP_ID
    remoteRef:
      key: github-amerenda-coder-app-id
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: CODER_APP_PRIVATE_KEY
    remoteRef:
      key: github-amerenda-coder-private-key
      property: password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None


---
# GitHub App credential for the dean-amer-dev ORG installation.
# Same App (k3s-arc-runners, app_id 2203066), different installation:
# App installations do not span accounts, and the repos are currently
# split between the amerenda user account and the dean-amer-dev org.
# `controller-manager` above stays on the amerenda install and serves the
# scale sets for k3s-dean-gitops and tailscale-acl, which did not move.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: controller-manager-dean
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "0"  # Install before runner scale set
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: controller-manager-dean
    creationPolicy: Owner
  data:
  - secretKey: github_app_id
    remoteRef:
      key: github-app-arc-id
      property: github_app_id
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: github_app_installation_id
    remoteRef:
      key: github-app-arc-installation-id-dean
      property: github_app_installation_id
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: github_app_private_key
    remoteRef:
      key: github-app-arc-private-key
      property: github_app_private_key
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
