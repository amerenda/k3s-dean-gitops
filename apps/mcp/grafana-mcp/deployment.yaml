apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp-server
  namespace: mcp-grafana-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-mcp-server
  template:
    metadata:
      labels:
        app: grafana-mcp-server
    spec:
      containers:
        - name: server
          image: grafana/mcp-grafana:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: GRAFANA_URL
              value: 'https://grafana.amer.dev'
            - name: GRAFANA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-secrets
                  key: grafana_api_key

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
