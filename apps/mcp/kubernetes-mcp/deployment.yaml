apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: mcp-kubernetes-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kubernetes-mcp-server
    spec:
      serviceAccountName: kubernetes-mcp-sa
      containers:
        - name: server
          # Pinned digest (was :latest — floating tag could silently change
          # behavior on any pod restart/reschedule). Corresponds to
          # mcp-server-kubernetes v4.1.6, confirmed from the running
          # container's package.json as of 2026-09-11. To find the digest
          # for a version bump: kubectl -n mcp-kubernetes-mcp get pod
          #   -o jsonpath='{.items[0].status.containerStatuses[0].imageID}'
          image: flux159/mcp-server-kubernetes@sha256:7aa82daa1f10f4305dd8b47fc0351250c342066edc52a68254bb50a84ec067a1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: ENABLE_UNSAFE_STREAMABLE_HTTP_TRANSPORT
              value: "true"
            - name: ALLOW_ONLY_READONLY_TOOLS
              value: "true"
          # exec probes, not tcpSocket: the wrapper's synchronous, blocking
          # subprocess model can wedge the single Node.js event loop (e.g.
          # during kubectl_reconnect's full API-discovery rebuild) while the
          # OS still completes new TCP handshakes, so tcpSocket can't detect
          # this failure mode. curl against /mcp exits 0 for any completed
          # HTTP response (including the server's normal 405 on GET) and
          # non-zero only on timeout/connection-refused — i.e. "is the event
          # loop actually responsive," not "is the port open."
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -s -o /dev/null -m 5 http://localhost:3000/mcp"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -s -o /dev/null -m 5 http://localhost:3000/mcp"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 8
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
        - name: host-proxy
          image: nginx:alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: kubernetes-mcp-nginx-proxy
