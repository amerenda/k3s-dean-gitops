apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-mcp-secrets
  namespace: mcp-obsidian
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: obsidian-mcp-secrets
    creationPolicy: Owner
  data:
    - secretKey: couchdb_password
      remoteRef:
        key: obsidian-mcp-bridge-couchdb-password
    - secretKey: e2ee_passphrase
      remoteRef:
        key: obsidian-livesync-e2e-passphrase
