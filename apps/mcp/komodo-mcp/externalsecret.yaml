apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komodo-mcp-secrets
  namespace: mcp-komodo-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: komodo-mcp-secrets
    creationPolicy: Owner
  data:
    - secretKey: komodo_api_key
      remoteRef:
        key: komodo-dean-api-key
    - secretKey: komodo_api_secret
      remoteRef:
        key: komodo-dean-api-secret