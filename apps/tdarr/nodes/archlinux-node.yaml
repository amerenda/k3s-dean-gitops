apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr-node-amd
  namespace: tdarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tdarr-node-amd
  template:
    metadata:
      labels:
        app: tdarr-node-amd
    spec:
      nodeSelector:
        kubernetes.io/hostname: archlinux
      containers:
        - name: tdarr-node
          image: ghcr.io/haveagitgat/tdarr_node:2.82.02
          imagePullPolicy: IfNotPresent
          # Required for VAAPI on the render node. Confirmed live 2026-09-22:
          # a hostPath mount of /dev/dri makes the device nodes visible
          # (correct crw-rw-rw- perms), but the default (non-privileged) pod
          # cgroup devices controller still blocks actually opening
          # renderD128 -- "Failed to open the given device!" from vainfo /
          # ffmpeg inside the container, and the node's own encoder self-test
          # reported hevc_vaapi/h264_vaapi/av1_vaapi as enabled but not
          # working. No AMD device plugin exists in this cluster to grant
          # the cgroup rule more narrowly, so this is the standard workaround
          # for that gap. Alex-approved 2026-09-23.
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK_SET
              value: "002"
            - name: nodeName
              value: "archlinux-amd"
            - name: serverIP
              value: tdarr-server.tdarr.svc.cluster.local
            - name: serverPort
              value: "8266"
            - name: inContainer
              value: "true"
            - name: ffmpegVersion
              value: "7"
            - name: transcodegpuWorkers
              value: "1"
            - name: transcodecpuWorkers
              value: "2"
            - name: healthcheckgpuWorkers
              value: "1"
            - name: healthcheckcpuWorkers
              value: "1"
            - name: apiKey
              valueFrom:
                secretKeyRef:
                  name: tdarr-api-key
                  key: TDARR_API_KEY
          volumeMounts:
            - name: movies
              mountPath: /movies
            - name: tv
              mountPath: /tv
            - name: transcode-cache
              mountPath: /temp
            - name: dri
              mountPath: /dev/dri
      volumes:
        # No AMD device plugin in this cluster (only infra/nvidia-device-plugin),
        # so this doesn't request amd.com/gpu as a scheduler resource. ffmpeg
        # VAAPI just needs the render node device -- verified 2026-09-21 that
        # /dev/dri/renderD128 on archlinux is world RW (crw-rw-rw-), so no
        # supplementary group / privileged mode is needed to use it.
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        # murderbot exports these over NFS (ansible-playbooks
        # playbooks/infrastructure/murderbot-nfs-export.yml), IP-allowlisted
        # to archlinux (10.100.20.25) only. See
        # Projects/Media Server Stack/notes/tdarr-archlinux-node-background.md
        # in the Dean Obsidian vault for why this is unauthenticated NFS
        # rather than a credentialed share (deferred to a later phase).
        - name: movies
          nfs:
            server: 10.100.20.19
            path: /mnt/storage/movies
        - name: tv
          nfs:
            server: 10.100.20.19
            path: /mnt/storage/tv
        # Kept local to archlinux rather than over NFS -- scratch I/O
        # shouldn't cross the 1GbE link twice per job on top of the
        # source-read/result-write it already does. On the host's btrfs
        # root disk (240G free at time of writing), not /tmp -- archlinux's
        # /tmp is a 16G tmpfs and a single large source file can exceed
        # that, which would consume host RAM instead of disk.
        - name: transcode-cache
          hostPath:
            path: /var/lib/tdarr-cache
            type: DirectoryOrCreate
