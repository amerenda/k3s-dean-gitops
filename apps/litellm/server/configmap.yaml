apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # --- murderbot (RTX PRO 4000, 24GB, llama.cpp/Qwen3.8-27B-GGUF+MTP — always hot) ---
      # Migrated 2026-08-19 twice in one day: vLLM+Qwen3.8-27B-NVFP4 (no MTP, 32768 ctx,
      # ~8 tok/s) was itself a same-day replacement for llama.cpp+Qwen3.6-35B-A3B, then
      # replaced again by this llama.cpp+Qwen3.8-27B+MTP setup because vLLM's NVFP4 quant
      # couldn't fit MTP speculative decoding alongside a usable KV cache on this 24GB card.
      # Same lesson already learned once for Qwen3.6 on this card: llama.cpp's memory
      # accounting fits this model family with MTP where vLLM's does not. See
      # komodo-dean-gitops/murderbot/llm/compose.yaml for the full flag-by-flag rationale
      # (every value arrived at by loading the model on this card and hitting real failures
      # first). Served alias (--alias qwen38-27b) is what llama-server reports as its
      # "model" name — unchanged from the vLLM setup, so no client-facing name change here.
      #
      # 49,152 max-model-len (vs vLLM's 32,768, and vs the old Qwen3.6-35B-A3B llama.cpp
      # setup's 98,304) — chosen after 65,536 survived a real near-max request but left only
      # 101 MiB headroom (too thin); 49,152 left 1.19 GiB under the same kind of test.
      # ~40 tok/s sustained with MTP — not the old Qwen3.6-35B-A3B setup's 120-140 tok/s
      # (that was a sparse MoE model, ~3B active params/token; this is dense 27B, inherently
      # costlier per token) but ~5x the vLLM setup's ~8 tok/s.
      #
      # No abliterated GGUF/NVFP4 quant of Qwen3.8-27B was available as of this migration —
      # the murderbot-uncensored-* presets below rely on prompt-based uncensoring only, not
      # true weight-level abliteration like the old huihui-ai Qwen3.6 setup had. Check
      # huggingface.co/sakamakismile and huggingface.co/huihui-ai before assuming this is
      # still true — several third-party "uncensored" Qwen3.8-27B GGUFs surfaced within days
      # of release but weren't vetted for this migration (scope: engine/context/throughput
      # fix, not a new abliteration adoption decision).

      # coder: used by OpenHands, praetor-coder-worker, and opencode.
      # parallel_tool_calls=false: coding agents must execute tools sequentially (read → edit → verify);
      # parallel calls cause race conditions on file state.
      # enable_thinking=false: coding agents want fast tool-call iteration, not long reasoning chains.
      # 40960/8192 = 49152 total: matches llama-server's -c 49152 (murderbot/llm/compose.yaml).
      - model_name: coder
        litellm_params:
          model: openai/qwen38-27b
          api_base: http://10.100.20.19:8088/v1
          api_key: none
          timeout: 600
          extra_body:
            parallel_tool_calls: false
            chat_template_kwargs:
              enable_thinking: false
        model_info:
          max_input_tokens: 40960
          max_output_tokens: 8192
          supports_function_calling: true

      # murderbot-v1-base: legacy smaller-budget preset, kept only because existing OWU custom
      # models (murderbot-v1-custom) still reference it as a base_model_id. Same backend as
      # every other murderbot-* alias now — budgets deliberately left conservative/unchanged.
      # enable_thinking=false: praetor's smoke suite caught this live — with thinking on and
      # an 8192 output budget shared with reasoning, ordinary liveness requests (max_tokens
      # capped low by the caller) came back with finish_reason=length and EMPTY content,
      # because the whole budget was consumed by reasoning_content. Not a hypothetical risk,
      # a reproduced regression (TestLiveness::test_owui_model_responds, 2026-07-23).
      - model_name: murderbot-v1-base
        litellm_params:
          model: openai/qwen38-27b
          api_base: http://10.100.20.19:8088/v1
          api_key: none
          timeout: 600
          extra_body:
            parallel_tool_calls: false
            chat_template_kwargs:
              enable_thinking: false
        model_info:
          max_input_tokens: 8192
          max_output_tokens: 8192
          supports_function_calling: true

      # murderbot-uncensored-v1-base: legacy alias, same rationale as murderbot-v1-base above.
      # Prompt-based uncensoring only as of the 2026-08-19 Qwen3.8 migration (see header
      # comment above) — not weight-level abliteration like the old Qwen3.6/huihui-ai setup.
      # enable_thinking=false: same empty-response regression as murderbot-v1-base above.
      - model_name: murderbot-uncensored-v1-base
        litellm_params:
          model: openai/qwen38-27b
          api_base: http://10.100.20.19:8088/v1
          api_key: none
          timeout: 600
          extra_body:
            parallel_tool_calls: false
            chat_template_kwargs:
              enable_thinking: false
        model_info:
          max_input_tokens: 8192
          max_output_tokens: 8192
          supports_function_calling: true

      # murderbot-v2-base: single unified entrypoint for OWU (replaces v1-base + v1-research-base).
      # enable_thinking=false: originally left ON here (MTP makes reasoning cheap, answer quality
      # was better in ad-hoc testing) — reverted 2026-07-23 after praetor's smoke suite reproduced
      # a real regression: with thinking on, ordinary requests with a caller-capped max_tokens
      # (e.g. OWU's liveness check, 256 tokens) came back finish_reason=length with EMPTY content
      # — the whole budget went to reasoning_content, none left for the visible answer. This is
      # exactly the "revisit if real usage shows otherwise" case the original comment called for.
      # 40960/8192 = 49152 total: matches llama-server's -c 49152 (murderbot/llm/compose.yaml).
      # tools (web search, infra, k8s) are configured in the OWU model preset, not here.
      # Both v2-custom (gated) and v2-uncensored-custom (permissive) use this base; behavior
      # is controlled entirely by the OWU system prompt, not by model weights.
      - model_name: murderbot-v2-base
        litellm_params:
          model: openai/qwen38-27b
          api_base: http://10.100.20.19:8088/v1
          api_key: none
          timeout: 600
          extra_body:
            parallel_tool_calls: false
            chat_template_kwargs:
              enable_thinking: false
        model_info:
          max_input_tokens: 40960
          max_output_tokens: 8192
          supports_function_calling: true

      # --- archlinux (RX 9070 XT, 16GB VRAM, Ollama — qwen3:14b at ~51 t/s) ---
      # Base model names use -base suffix so OWU only shows the configured presets
      # (archlinux-v0-custom → archlinux-v0, archlinux-uncensored-v0-custom → archlinux-uncensored-v0).

      - model_name: archlinux-v0-base
        litellm_params:
          model: ollama/qwen3:14b
          api_base: http://10.100.20.25:11434
          timeout: 300
          extra_body:
            think: false
            options:
              num_ctx: 32768
        model_info:
          max_input_tokens: 16384
          max_output_tokens: 4096
          supports_function_calling: true

      - model_name: archlinux-uncensored-v0-base
        litellm_params:
          model: ollama/qwen3:14b
          api_base: http://10.100.20.25:11434
          timeout: 300
          extra_body:
            think: false
            options:
              num_ctx: 32768
        model_info:
          max_input_tokens: 16384
          max_output_tokens: 4096
          supports_function_calling: true

      # --- embeddings (nomic-embed-text via mac-mini Ollama for mem0) ---
      # mem0 uses this for vector search. Requires nomic-embed-text pulled on mac-mini:
      #   curl -X POST http://10.100.20.18:11434/api/pull -d '{"name":"nomic-embed-text"}'
      - model_name: nomic-embed-text
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: http://10.100.20.18:11434
          api_key: none
        model_info:
          mode: embedding
          max_input_tokens: 8192
          output_vector_size: 768

      # --- image-gen (imggen service on k3s, ComfyUI on murderbot:8188) ---
      # Routes to imggen FastAPI proxy which expands prompts via archlinux qwen3:14b
      # then generates via ComfyUI FLUX FP8 + LoRA stack. Returns base64 PNG in markdown.
      # Only active when img-murderbot Komodo stack is running (image mode).
      # timeout=300: ComfyUI generation takes 30-90s; 300s covers slow first-generation.
      - model_name: image-gen
        litellm_params:
          model: openai/image-gen
          api_base: http://imggen-server.imggen.svc.cluster.local:8000/v1
          api_key: none
          timeout: 300
        model_info:
          max_input_tokens: 4096
          max_output_tokens: 65536
          supports_function_calling: false

    router_settings:
      routing_strategy: least-busy
      num_retries: 3
      retry_after: 2
      cooldown_time: 30
      allowed_fails: 5
      retry_policy:
        BadRequestErrorRetries: 3

    mcp_servers:
      searxng:
        url: "http://mcp-searxng-server.mcp-searxng.svc.cluster.local:8000/mcp"
        transport: "http"
        allow_all_keys: true
      secure-search:
        url: "http://secure-search-mcp-server.secure-search-mcp.svc.cluster.local:8000/mcp"
        transport: "http"
        allow_all_keys: true
      infra:
        url: "http://infra-mcp-server.infra-mcp.svc.cluster.local:8000/mcp"
        transport: "http"
        allow_all_keys: true
      github:
        url: "http://github-mcp-server.github-mcp.svc.cluster.local:8000/mcp"
        transport: "http"
        allow_all_keys: true
      kubernetes-mcp:
        url: "http://kubernetes-mcp-server.mcp-kubernetes-mcp.svc.cluster.local:8000/mcp"
        transport: "http"
        allow_all_keys: true
      praetor:
        url: "http://praetor-mcp-server.praetor-mcp.svc.cluster.local:8000/mcp"
        transport: "http"
        allow_all_keys: true

      # homeassistant: removed from LiteLLM MCP — 89 HA tools added ~36K tokens to every
      # model request via server:mcp:lm, causing prompt processing timeouts (30-60s) and
      # intermittent 400s from the llama.cpp jinja template renderer. Total tool count drops
      # from 123 to 34; prompt token overhead drops from ~36K to ~6K.
      # HA tools remain accessible via the mcp-bridge OpenAPI endpoint in OWU.
      grafana-mcp:
        url: "http://grafana-mcp-server.mcp-grafana-mcp.svc.cluster.local:8000/mcp"
        transport: "http"
      komodo-mcp:
        url: "http://komodo-mcp-server.mcp-komodo-mcp.svc.cluster.local:8000/mcp"
        transport: "http"
      obsidian-mcp:
        url: "http://obsidian-mcp-server.mcp-obsidian.svc.cluster.local:8787/mcp"
        transport: "http"
    litellm_settings:
      drop_params: true
      callbacks:
        - prometheus
