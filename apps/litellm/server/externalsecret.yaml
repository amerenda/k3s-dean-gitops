apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretstore
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
  data:
    - secretKey: master-key
      remoteRef:
        key: litellm-master-key
        property: password
    - secretKey: database-url
      remoteRef:
        key: litellm-database-url
        property: password
    # Used only by the postStart owu-refresh-hook (see owu-refresh-hook-configmap.yaml)
    # to sign in to OWU and re-trigger its tool-server connection refresh after this
    # pod restarts.
    - secretKey: owui-admin-password
      remoteRef:
        key: openwebui-dean-admin-password
        property: password
