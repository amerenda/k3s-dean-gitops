apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-server
  namespace: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: litellm-server
      annotations:
        configmap.reloader.stakater.com/reload: "litellm-config,litellm-custom-hooks,litellm-migration-override,litellm-owu-refresh-hook"
    spec:
      # Was hard-pinned to murderbot (kubernetes.io/hostname: murderbot) as a
      # reactive fix for a flaky archlinux node going NotReady (#974, June
      # 2026). No architectural need for this pod to run specifically on
      # murderbot -- llama-server (10.100.20.19:8088) and Postgres (mac-mini)
      # are both reached over the network regardless of node. That pin meant
      # this pod went down for 7+ hours during INC-2026-08-30 (murderbot host
      # memory exhaustion) instead of self-healing like everything else did,
      # since kubelet had nowhere else to (re)schedule it. Matches the
      # arch-only selector already used by imggen/praetor-webhook-adapter for
      # the same GPU-adjacent murderbot/archlinux pair.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: server
        image: ghcr.io/berriai/litellm:main-stable
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: master-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: database-url
        - name: MCP_TOOL_PREFIX_SEPARATOR
          value: "_"
        - name: LITELLM_LOCAL_MODEL_COST_MAP
          value: "true"
        - name: OWUI_ADMIN_EMAIL
          value: "alex@amer.dev"
        - name: OWUI_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: owui-admin-password
        lifecycle:
          # OWU only fetches its MCP tool-server connections once, at its own
          # startup -- it never notices when this pod (litellm) restarts, and
          # silently serves a dead connection until someone manually restarts
          # OWU too. This re-triggers OWU's refresh every time this pod
          # starts, so a k3s-initiated restart (OOM, rolling deploy, node
          # eviction -- all of which are expected/routine here) can no longer
          # leave OWU stuck. Runs in the background (backgrounded before this
          # hook returns) so a slow or failing OWU can never block or fail
          # this pod's own startup.
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - nohup python3 /app/hooks/refresh_owu_tools.py > /tmp/owu-refresh-hook.log 2>&1 &
        startupProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 40
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 4Gi
        args:
        - --config
        - /app/config.yaml
        - --port
        - '4000'
        volumeMounts:
        - name: litellm-config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: custom-hooks
          mountPath: /app/custom_hooks
          readOnly: true
        - name: migration-override
          mountPath: /app/litellm/proxy/prisma_migration.py
          subPath: prisma_migration.py
          readOnly: true
        - name: owu-refresh-hook
          mountPath: /app/hooks
          readOnly: true
      volumes:
      - name: litellm-config
        configMap:
          name: litellm-config
      - name: custom-hooks
        configMap:
          name: litellm-custom-hooks
      - name: migration-override
        configMap:
          name: litellm-migration-override
      - name: owu-refresh-hook
        configMap:
          name: litellm-owu-refresh-hook
